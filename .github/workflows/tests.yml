name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check benchmark correctness without timing
        run: uv run --locked --group benchmark pytest benchmarks --benchmark-disable
